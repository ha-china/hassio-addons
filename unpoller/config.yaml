---
name: UnPoller
version: 5.0.4
slug: unpoller
description: |-
  [老王杂谈说]：收集 UniFi 控制器数据并报告到 InfluxDB 实例，或导出以供 Prometheus 采集。
arch:
  - aarch64
  - amd64
image: "ghcr.nju.edu.cn/bluemaex/ha-addons-unpoller"
startup: system
url: https://gh-proxy.org/github.com/bluemaex/home-assistant-addons/tree/master/unpoller
init: false
ports:
  9130/tcp: 9130
ports_description:
  9130/tcp: Unpoller Prometheus Endpoint
panel_icon: mdi:router-network
map:
  - config
options:
  log_level: info
  dynamic_configuration_path: "/config/addons/unpoller/up.conf"
  env_vars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  dynamic_configuration_path: str?
  env_vars:
    - str
