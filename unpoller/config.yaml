---
name: UnPoller
version: 5.0.0
slug: unpoller
description: |-
  [老王杂谈说]：收集您的 UniFi 控制器数据并将其上报至 InfluxDB 实例，或将其导出以便 Prometheus 收集。
arch:
  - aarch64
  - amd64
  - armv7
image: "ghcr.nju.edu.cn/bluemaex/ha-addons-unpoller-{arch}"
startup: system
url: https://gh-proxy.org/github.com/bluemaex/home-assistant-addons/tree/master/unpoller
init: false
ports:
  9130/tcp: 9130
ports_description:
  9130/tcp: Unpoller Prometheus Endpoint
panel_icon: mdi:router-network
map:
  - config
options:
  log_level: info
  dynamic_configuration_path: "/config/addons/unpoller/up.conf"
  env_vars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  dynamic_configuration_path: str?
  env_vars:
    - str
