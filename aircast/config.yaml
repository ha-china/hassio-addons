name: AirCast
version: 5.2.0
slug: aircast
description: '[老王杂谈说]：为您的 Chromecast 设备提供 AirPlay 功能。'
url: https://gh-proxy.org/github.com/hassio-addons/app-aircast
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
host_network: true
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  latency_rtp: 0
  latency_http: 0
  drift: false
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  address: str?
  latency_rtp: int
  latency_http: int
  drift: bool
image: ghcr.nju.edu.cn/hassio-addons/aircast
