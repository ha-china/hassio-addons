name: Tautulli
version: 6.1.1
slug: tautulli
description: '[老王杂谈说]：Plex 媒体服务器的监控和跟踪工具'
url: https://gh-proxy.org/github.com/hassio-addons/app-tautulli/tree/main/README.md
webui: http://[HOST]:[PORT:8181]
arch:
