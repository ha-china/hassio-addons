name: The Lounge
version: 0.23.0
slug: thelounge
description: '[老王杂谈说]：一个私有化的 Web IRC 客户端'
url: https://gh-proxy.org/github.com/hassio-addons/app-thelounge
arch:
  - aarch64
  - amd64
ingress: true
ingress_stream: true
panel_admin: false
init: false
panel_icon: mdi:chat
ports:
  80/tcp: null
ports_description:
  80/tcp: The Lounge Web UI (Not required for Ingress)
map:
  - ssl
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  default_theme: default
  themes:
    - thelounge-theme-solarized
  users: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  default_theme: str
  themes:
    - str
  users:
    - str
image: ghcr.nju.edu.cn/hassio-addons/thelounge/{arch}
