name: Aurral
version: "1.76.40"
slug: aurral
description: >-
  [老王杂谈说]：针对自托管 Lidarr 的音乐发现、请求管理、流程和播放列表导入，并具有基于库的推荐。
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons/blob/master/aurral/README.md
arch:
  - aarch64
  - amd64
image: ghcr.1ms.run/alexbelgium/aurral-{arch}
init: false
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Aurral Web UI
webui: http://[HOST]:[PORT:3001]
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  download_folder: /share/aurral/downloads
  weekly_flow_folder: weekly-flow
schema:
  download_folder: str
  weekly_flow_folder: str
