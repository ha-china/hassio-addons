name: EMQX
version: 0.10.1
slug: emqx
description: '[老王杂谈说]：适用于物联网的最可扩展的 MQTT 中间件。一个替代 Mosquitto 应用程序的选项。'
url: https://gh-proxy.org/github.com/hassio-addons/app-emqx
startup: services
ingress: true
ingress_port: 18083
ingress_stream: true
init: false
panel_icon: mdi:pipe
panel_title: EMQX
arch:
  - aarch64
  - amd64
map:
  - ssl
  - addon_config:rw
options:
  env_vars: []
host_network: true
schema:
  env_vars:
    - name: match(^EMQX_([A-Z0-9_])+$)
      value: str
image: ccr.ccs.tencentyun.com/hassio-addons/emqx
