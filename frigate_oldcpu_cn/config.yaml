name: Frigate (For old x86_64 CPU without AVX) CN
version: 0.14.1
panel_icon: "mdi:cctv"
panel_title: Frigate
slug: frigate-oldcpu
description: '[老王杂谈说]：null'
url: "https://gh-proxy.org/github.com/blakeblackshear/frigate"
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:5000]/"
watchdog: "http://[HOST]:[PORT:5000]/"
ingress: true
ingress_port: 5000
ingress_entry: /
panel_admin: false
homeassistant_api: true
hassio_api: true
ports:
  8555/tcp: 8555
  8555/udp: 8555
  8554/tcp: null
  5000/tcp: null
  1984/tcp: null
  1935/tcp: null
ports_description:
  8555/tcp: WebRTC over tcp
  8555/udp: WebRTC over udp
  8554/tcp: RTSP Restream
  5000/tcp: Web interface (not required for Home Assistant Ingress)
  1984/tcp: go2rtc API
host_network: false
devices:
  - /dev/dri/renderD128
  - /dev/apex_0
  - /dev/apex_1
  - /dev/apex_2
  - /dev/apex_3
  - /dev/dri/card0
  - /dev/vchiq
  - /dev/video10
  - /dev/video0
usb: true
video: true
tmpfs: true
full_access: false
privileged:
  - SYS_ADMIN
environment:
  CONFIG_FILE: /config/frigate.yml
  HF_ENDPOINT: "https://huggingface.mirror.frigate-cn.video"
  GITHUB_ENDPOINT: "https://github.mirror.frigate-cn.video"
  TF_KERAS_MOBILENET_V2_WEIGHTS_URL: "https://cnb.cool/frigate-cn/mirrors/storage.googleapis/-/git/raw/main/tensorflow/keras-applications/mobilenet_v2/mobilenet_v2_weights_tf_dim_ordering_tf_kernels_0.35_224_no_top.h5"
  TZ: "Asia/Shanghai"
schema:
  plus_api_key: password?
services:
  - "mqtt:want"
arch:
  - amd64
map:
  - "media:rw"
  - "config:rw"
  - "ssl"
