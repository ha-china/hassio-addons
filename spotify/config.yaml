name: Spotify Connect
version: 0.18.0
slug: spotify
description: '[老王杂谈说]：在你的 Home Assistant 设备上播放 Spotify 音乐'
url: https://gh-proxy.org/github.com/hassio-addons/app-spotify-connect
arch:
  - aarch64
  - amd64
host_network: true
audio: true
init: false
options:
  name: Home Assistant
  bitrate: 160
  initial_volume: 50
  autoplay: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  name: str
  bitrate: list(96|160|320)
  autoplay: bool
  initial_volume: match(^([0-9]|[1-9][0-9]|100)$)?
image: ghcr.nju.edu.cn/hassio-addons/spotify/{arch}
