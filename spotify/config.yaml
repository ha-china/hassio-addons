name: Spotify Connect
version: 0.17.0
slug: spotify
description: '[老王杂谈说]：在您的Home Assistant设备上播放Spotify音乐'
url: https://gh-proxy.org/github.com/hassio-addons/addon-spotify-connect
arch:
  - aarch64
  - amd64
host_network: true
audio: true
init: false
options:
  name: Home Assistant
  bitrate: 160
  initial_volume: 50
  autoplay: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  name: str
  bitrate: list(96|160|320)
  username: str?
  password: password?
  autoplay: bool
  initial_volume: match(^([0-9]|[1-9][0-9]|100)$)?
image: ghcr.1ms.run/hassio-addons/spotify/{arch}
