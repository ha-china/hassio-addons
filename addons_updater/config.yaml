arch:
  - aarch64
  - amd64
boot: manual
description: '[老王杂谈说]：通过对齐版本标签与上游发布版本实现插件自动更新'
environment:
  GIT_DISCOVERY_ACROSS_FILESYSTEM: "1"
image: ghcr.nju.edu.cn/alexbelgium/addons_updater-{arch}
init: false
map:
  - addon_config:rw
name: Repository Updater
options:
  date_iso8601: true
  env_vars: []
  gitapi: gitapi
  gituser: gituser
  repository: alexbelgium/hassio-addons
schema:
  date_iso8601: bool?
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  dry_run: bool?
  gitapi: str
  gitmail: str?
  gituser: str
  repository: str
  verbose: bool?
slug: updater
udev: true
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons/tree/master/addons_updater
version: "2026.06"
