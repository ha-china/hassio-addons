name: "DBF (DB-Infoscreen)"
version: "1.1.0"
slug: "dbf"
description: "[老王杂谈说]：作为 Home Assistant 应用的火车站出发显示屏（曾名 db-fakescreen）"
url: "https://gh-proxy.org/github.com/FaserF/hassio-addons/tree/master/dbf"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8092
ingress_entry: "/"
panel_icon: "mdi:train"
map:
  - homeassistant_config:rw
ports:
  8092/tcp: 8092
ports_description:
  8092/tcp: "Web Interface (Required for HA App integration, not needed for Ingress)"
options:
  log_level: info
  workers: 2
  imprint_name: ""
  imprint_address: ""
  privacy_policy_url: ""
schema:
  log_level: list(debug|info|warning|error|fatal)?
  workers: int?
  imprint_name: str?
  imprint_address: str?
  privacy_policy_url: str?
image: ghcr.nju.edu.cn/faserf/hassio-addons-dbf-{arch}
