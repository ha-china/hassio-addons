name: "linkding"
version: "1.47.0"
upstream: "1.45.0"
slug: linkding
description: >-
  [老王杂谈说]：linkding 是一个你可以自行托管的书签管理器。它的设计理念是极简、快速，并使用 Docker 轻松设置。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /etc/linkding/data
image: sissbruecker/linkding
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:9090]"
ingress: false
ingress_port: 9090
