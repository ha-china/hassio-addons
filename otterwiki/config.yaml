name: Otter Wiki
version: "2.20.2"
upstream: 2.7.0
slug: otterwiki
description: >-
  [老王杂谈说]：水獭维基是一种基于 Python 的用于协作内容管理的软件，被称为维基。内容存储在 git 仓库中，该仓库会跟踪所有的更改。Markdown 用作标记语言。水獭维基是用 Python 编写的，使用了微框架 Flask。halfmoon 用作 CSS 框架，CodeMirror 用作编辑器。Font Awesome Free 用于提供图标。
arch:
  - amd64
  - aarch64
url: "https://ghfast.top/github.com/jdeath/homeassistant-addons"
ports:
  80/tcp: 8084
ports_description:
  80/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /app-data
image: redimp/otterwiki
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
ingress: false
ingress_port: 80
