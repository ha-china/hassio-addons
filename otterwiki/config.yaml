name: Otter Wiki
version: "2.26.3"
upstream: 2.7.0
slug: otterwiki
description: >-
  [老王杂谈说]：Otter Wiki 是一款基于 Python 的用于协作内容管理（称为维基）的软件，内容由 Git 仓库存储并追踪所有更改，Markdown 用作标记语言，该软件使用 Python 微框架 Flask 编写，并将 halfmoon 用作 CSS 框架，将 CodeMirror 用作编辑器，使用 Font Awesome Free 提供图标。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  80/tcp: 8084
ports_description:
  80/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /app-data
image: redimp/otterwiki
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
ingress: false
ingress_port: 80
