name: Otter Wiki
version: "2.26.1"
upstream: 2.7.0
slug: otterwiki
description: >-
  [老王杂谈说]：Otter Wiki 是基于 Python 的协作内容管理系统（即维基软件），内容存储于 Git 仓库以追踪所有更改，使用 Markdown 作为标记语言，采用 Python 微框架 Flask 编写，配合 halfmoon CSS 框架和 CodeMirror 编辑器，并使用 Font Awesome Free 提供图标服务。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  80/tcp: 8084
ports_description:
  80/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /app-data
image: redimp/otterwiki
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
ingress: false
ingress_port: 80
