name: Otter Wiki
version: "2.17.3"
upstream: 2.7.0
slug: otterwiki
description: >-
  [老王杂谈说]：一个 Otter Wiki 是用于协作内容管理的基于 Python 的软件，被称为维基，内容存储在 git 仓库中以跟踪所有更改，使用 Markdown 作为标记语言，使用微框架 Flask 用 Python 编写，使用 halfmoon 作为 CSS 框架和 CodeMirror 作为编辑器，Font Awesome Free 用于提供图标。
arch:
  - amd64
  - aarch64
url: "https://ghfast.top/github.com/jdeath/homeassistant-addons"
ports:
  80/tcp: 8084
ports_description:
  80/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /app-data
image: redimp/otterwiki
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
ingress: false
ingress_port: 80
