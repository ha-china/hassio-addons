name: searxng-mcp-server
version: "1.0"
upstream: "1.0"
slug: searxngmcpserver
description: >-
  [老王杂谈说]：一个与 SearXNG 集成的 Model Context Protocol (MCP) 服务器 SSE 实现，用于为 AI 代理提供强大且注重隐私的搜索功能。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  32769/tcp: 32769
ports_description:
  32769/tcp: "API Interface"
map:
  - type: addon_config
    read_only: false
environment:
  HOST: "0.0.0.0"
  TRANSPORT: = "SSE"
options:
  SEARXNG_BASE_URL: "http://172.17.0.1:32768"
schema:
  SEARXNG_BASE_URL: "str"
boot: manual
#host_pid: true
init: false
startup: services
