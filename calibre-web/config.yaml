name: Calibre-Web
version: 0.1.0
slug: calibre-web
description: '[老王杂谈说]：浏览、阅读并下载 Calibre 文库中的电子书'
url: https://gh-proxy.org/github.com/hassio-addons/app-calibre-web
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:bookshelf
init: false
arch:
  - aarch64
  - amd64
backup: cold
backup_exclude:
  - '**/cache/**'
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true
ports:
  8083/tcp: null
ports_description:
  8083/tcp: Web interface, OPDS & Kobo sync (not required for Ingress)
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.nju.edu.cn/hassio-addons/calibre-web
