arch:
  - aarch64
  - amd64
description: '[老王杂谈说]：一个能够同时查询多个搜索引擎、具有主题和插件商店的搜索聚合器。'
image: ghcr.nju.edu.cn/alexbelgium/degoog-{arch}
ingress: true
init: false
map:
  - addon_config:rw
name: Degoog
options:
  env_vars: []
  PGID: 0
  PUID: 0
panel_icon: mdi:magnify
ports:
  4444/tcp: 4444
ports_description:
  4444/tcp: Web interface
schema:
  DEGOOG_SETTINGS_PASSWORDS: password?
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  PGID: int
  PUID: int
  TZ: str?
slug: degoog
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons/tree/master/degoog
version: "1.1.0"
