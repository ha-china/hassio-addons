name: Jellyfin
version: 0.1.0
slug: jellyfin
description: '[老王杂谈说]：为您电影、节目和音乐打造的免版税软件媒体系统'
url: https://gh-proxy.org/github.com/hassio-addons/app-jellyfin
ingress: true
ingress_stream: true
panel_icon: mdi:jellyfish
init: false
arch:
  - aarch64
  - amd64
backup: cold
backup_exclude:
  - '**/cache/**'
  - '**/log/**'
video: true
map:
  - type: addon_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true
ports:
  8096/tcp: 8096
  8920/tcp: null
  7359/udp: null
ports_description:
  8096/tcp: Web interface & API, and where the Jellyfin apps connect
  8920/tcp: The same over HTTPS, once `ssl` is turned on
  7359/udp: Server discovery, so the apps can find this server themselves
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.nju.edu.cn/hassio-addons/jellyfin
