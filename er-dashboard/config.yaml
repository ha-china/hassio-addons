name: "ER-Startseite (Dashboard)"
version: "0.0.2"
slug: er-dashboard
image: ghcr.nju.edu.cn/faserf/hassio-addons-er-dashboard-{arch}
description: "[老王杂谈说]：一个现代且高度可定制的霓虹美学仪表盘。"
url: "https://ghfast.top/github.com/Eidolf/ER-Startseite"
arch:
  - aarch64
  - amd64
init: false
map:
  - config:rw
  - share:rw
  - ssl:ro
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  ssl: bool
  certfile: str
  keyfile: str
ingress: true
ingress_stream: true
panel_icon: mdi:view-dashboard-variant
ports:
  9123/tcp: 9123 # Web UI (direct access)
