name: Bedrock Server Manager
version: "3.7.2"
upstream: 3.7.1
slug: bedrockservermanager
description: >-
  [老王杂谈说]：Bedrock Server Manager是一款全面的Python服务器，专为轻松安装、管理和维护Minecraft Bedrock专用服务器而设计。
arch:
  - amd64
  - aarch64
url: "https://ghfast.top/github.com/jdeath/homeassistant-addons"
image: "ghcr.nju.edu.cn/dmedina559/bedrock-server-manager"
ports:
  11325/tcp: 11325
  19132/udp: 19132
ports_description:
  11325/tcp: "Web Interface"
  19132/udp: "Minecraft API"
map:
  - type: addon_config
    read_only: false
    path: /root/
boot: auto
startup: services
panel_admin: false
ingress: false
ingress_port: 11325
