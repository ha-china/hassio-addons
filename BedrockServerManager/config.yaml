name: Bedrock Server Manager
version: "3.9.1"
upstream: 3.7.1
slug: bedrockservermanager
description: >-
  [老王杂谈说]：Bedrock Server Manager 是一款综合性 Python 服务器，旨在轻松安装、管理和维护 Minecraft 基岩版专用服务器。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
image: "ghcr.nju.edu.cn/dmedina559/bedrock-server-manager"
ports:
  11325/tcp: 11325
  19132/udp: 19132
ports_description:
  11325/tcp: "Web Interface"
  19132/udp: "Minecraft API"
map:
  - type: addon_config
    read_only: false
    path: /root/
boot: auto
startup: services
panel_admin: false
ingress: false
ingress_port: 11325
