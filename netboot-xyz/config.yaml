---
name: Netboot.xyz
version: 2.0.0
slug: netboot-xyz
description: '[老王杂谈说]：PXE服务器用于在您的本地网络中部署操作系统'
url: https://ghfast.top/github.com/FaserF/hassio-addons/tree/master/netboot-xyz
arch:
  - aarch64
  - amd64
image: ghcr.nju.edu.cn/faserf/hassio-addons-netboot-xyz-{arch}
host_network: true
# webui: http://[HOST]:[PORT:3000]
ingress: true
ingress_port: 3000
init: false
full_access: true
privileged:
  - NET_ADMIN
map:
  - media:rw
panel_icon: mdi:download-network
options:
  path: "/media/netboot/image"
  path_config: "/media/netboot/config"
  dhcp_range: 192.168.1.200
schema:
  path: str
  path_config: str
  dhcp_range: str
ports:
  "85": 85
  "3000": 3000
  69/udp: 69
ports_description:
  "85": "NGINX server for hosting boot assets - REQUIRED for PXE boot!"
  "3000": "Web configuration interface (uses Ingress, can be changed)"
  69/udp: "TFTP Port - REQUIRED for PXE boot!"
