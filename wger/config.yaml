arch:
  - amd64
  - aarch64
description: '[老王杂谈说]：管理您的个人锻炼、体重和饮食计划'
image: ghcr.nju.edu.cn/alexbelgium/wger-{arch}
map:
  - share:rw
  - addon_config:rw
  - homeassistant_config:rw
  - ssl:ro
name: Wger
options:
  env_vars:
    - name: DJANGO_DEBUG
      value: "False"
  CONFIG_LOCATION: /config/config.yaml
ports:
  80/tcp: 9927
ports_description:
  80/tcp: Web interface
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  CONFIG_LOCATION: str
  POWERSYNC_ENABLED: bool?
slug: wger
udev: true
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons
version: "2.8.0.1"
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
