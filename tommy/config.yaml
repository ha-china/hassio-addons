name: TOMMY Zero
version: "8.1.0"
slug: tommysense-homeassistant-addon
description: '[老王杂谈说]：TOMMY Zero 是一个无线网络感知系统，它利用 Wi-Fi 数据包中的信道状态信息（CSI）将现有设备转换为presence（存在）传感器，并在您的硬件上运行，所有传感数据均保留在您的本地网络上。'
url: "https://gh-proxy.org/github.com/tommy-sense/homeassistant-addon"
arch:
  - aarch64
  - amd64
image: tommysense/virtual-bridge
startup: application
boot: auto
stage: stable
host_network: true
apparmor: true
ingress: true
ingress_port: 0
panel_icon: mdi:wifi-arrow-left-right
init: false
map:
  - type: data
    read_only: False
  - type: share
    read_only: False
options:
  ports:
    dashboard: 8089
    file_server_http: 8090
    file_server_https: 8091
    mqtt: 1886
    udp_relay: 8547
  allowed_origins: []
schema:
  ports:
    dashboard: port
    file_server_http: port
    file_server_https: port
    mqtt: port
    udp_relay: port
  allowed_origins:
    - url
