name: "Razzia"
version: "3.1.0"
upstream: "3.1.0"
slug: razzia
description: >-
  [老王杂谈说]：Razzia 是一个简洁且开源的问答平台，允许用户在自己的服务器上托管，以适用于小型活动。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /app/config
image: ghcr.nju.edu.cn/ralex91/razzia
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:3000]"
panel_admin: false
ingress: false
ingress_port: 3000
