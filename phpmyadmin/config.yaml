name: phpMyAdmin
version: 0.14.0
slug: phpmyadmin
description: '[老王杂谈说]：MariaDB 应用官方的 Web 界面'
url: https://gh-proxy.org/github.com/hassio-addons/app-phpmyadmin
ingress: true
ingress_stream: true
panel_icon: mdi:database
arch:
  - aarch64
  - amd64
init: false
services:
  - mysql:need
hassio_api: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  upload_limit: int?
image: ghcr.nju.edu.cn/hassio-addons/phpmyadmin/{arch}
