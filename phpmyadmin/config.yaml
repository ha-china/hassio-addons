name: phpMyAdmin
version: 2.0.15
slug: phpmyadmin
description: '[老王杂谈说]：为官方 MariaDB 应用程序创建的网页界面'
url: https://gh-proxy.org/github.com/erik73/app-phpmyadmin/
ingress: true
ingress_stream: true
panel_icon: mdi:database
arch:
  - aarch64
  - amd64
init: false
services:
  - mysql:need
hassio_api: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  upload_limit: int?
image: ghcr.nju.edu.cn/erik73/phpmyadmin/{arch}
