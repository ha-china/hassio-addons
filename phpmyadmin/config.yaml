name: phpMyAdmin
version: 0.14.1
slug: phpmyadmin
description: '[老王杂谈说]：用于官方 MariaDB 应用程序的网络接口气'
url: https://gh-proxy.org/github.com/hassio-addons/app-phpmyadmin
ingress: true
ingress_stream: true
