name: "Trade Republic Headless Browser"
version: "1.1.2"
slug: "traderepublic"
image: ghcr.nju.edu.cn/faserf/hassio-addons-traderepublic-{arch}
description: "[老王杂谈说]：Trade Regroup 无头浏览器与会话提供者（WAF 破解程序与实时连接维护工具）。"
url: "https://gh-proxy.org/github.com/FaserF/ha-traderepublic"
arch:
  - aarch64
  - amd64
init: false
startup: services
discovery:
  - traderepublic
map:
  - homeassistant_config:rw
panel_icon: mdi:finance
panel_title: "Trade Republic"
options:
  log_level: "info"
  keep_alive_interval: 60
  cache_retention_hours: 12
  auto_install_integration: true
  github_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  keep_alive_interval: int
  cache_retention_hours: int
  auto_install_integration: bool
  github_token: str?
ports: {}
ports_description:
  8095/tcp: "Direct Web/API Access (disabled by default — use Ingress for secure access)"
hassio_api: true
ingress: true
ingress_port: 8095
ingress_entry: /
