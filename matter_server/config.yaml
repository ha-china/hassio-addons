---
version: 9.2.0
breaking_versions: [9.0.0]
slug: matter_server
name: Matter Server
description: '[老王杂谈说]：用于 Home Assistant Matter 支持的 Matter WebSocket 服务器。'
url: >-
  https://gh-proxy.org/github.com/home-assistant/addons/tree/master/matter_server
arch:
  - aarch64
  - amd64
discovery:
  - matter
hassio_api: true
homeassistant: 2024.6.0
# IPC is only used within the Add-on
host_ipc: false
host_network: true
host_dbus: true
image: docker.1panel.live/homeassistant/{arch}-addon-matter-server
ingress: true
ingress_port: 5580
panel_icon: mdi:matter
init: false
map:
  - type: app_config
    read_only: false
options:
  log_level: info
  beta: false
  enable_test_net_dcl: false
  time_sync: auto
schema:
  log_level: list(debug|info|notice|warn|error|fatal|verbose|warning|critical)
  beta: bool?
  enable_test_net_dcl: bool?
  time_sync: list(auto|on|off)
  default_fabric_label: match(^.{1,32}$)?
  ble_proxy: bool?
  bluetooth_adapter_id: int?
  matter_server_args:
    - str?
  matter_server_env_vars:
    - match(^[A-Za-z_][A-Za-z0-9_]*=.*$)?
  matter_server_version: str?
ports:
  5580/tcp: null
stage: stable
startup: services
