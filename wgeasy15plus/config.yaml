name: WG Easy 15+
version: "15.2.2"
upstream: 15.2.1
slug: wgeasy15plus
description: >-
  [老王杂谈说]：WireGuard Easy 15+: 集成了 WireGuard 和 UI
arch:
  - amd64
  - aarch64
url: "https://ghfast.top/github.com/jdeath/homeassistant-addons"
image: ghcr.nju.edu.cn/wg-easy/wg-easy
ports:
  51820/udp: "51820"
  51821/tcp: "51821"
ports_description:
  51820/udp: "51820"
  51821/tcp: "WireGuard: forward this port in your router"
map:
  - type: addon_config
    read_only: false
    path: /etc/wireguard
environment:
  INSECURE: "true"
boot: auto
startup: services
ingress: false
webui: http://[HOST]:[PORT:51821]
privileged:
  - "NET_ADMIN"
devices:
  - "/dev/net/tun"
