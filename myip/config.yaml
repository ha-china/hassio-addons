name: MyIP
version: "v8.0.0"
upstream: latest
slug: myip
description: >-
  [老王杂谈说]：最好的 IP 工具箱。轻松检查您的 IP、IP 地理位置、检测 DNS 泄漏、检查 WebRTC 连接、网速测试、延迟测试、MTR 测试、网站可用性检查、域名搜索等！
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  18966/tcp: 18966
ports_description:
  18966/tcp: "Web Interface"
image: ghcr.nju.edu.cn/jason5ng32/myip
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:18966]"
ingress: false
ingress_port: 18966
