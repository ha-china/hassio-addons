---
version: 2.0.0
slug: duckdns
name: Duck DNS
description: >-
  [老王杂谈说]：带有 Let's Encrypt 支持的免费动态 DNS (DynDNS 或 DDNS) 服务
url: https://gh-proxy.org/github.com/home-assistant/addons/tree/master/duckdns
arch:
  - aarch64
  - amd64
hassio_api: true
init: false
image: docker.1panel.live/homeassistant/{arch}-addon-duckdns
map:
  - ssl:rw
options:
  domains:
    - null
  token: null
  aliases: []
  lets_encrypt:
    accept_terms: false
    algo: secp384r1
    certfile: fullchain.pem
    keyfile: privkey.pem
  seconds: 300
schema:
  domains:
    - match(.+\.duckdns\.org)
  token: str
  aliases:
    - alias: str
      domain: str
  lets_encrypt:
    accept_terms: bool
    algo: list(rsa|prime256v1|secp384r1)
    certfile: str
    keyfile: str
  seconds: int
  ipv4: str?
  ipv6: str?
startup: services
