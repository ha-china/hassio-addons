name: qBittorrent
version: 0.1.0
slug: qbittorrent
description: '[老王杂谈说]：快速、稳定且轻量级的 BitTorrent 客户端'
url: https://gh-proxy.org/github.com/hassio-addons/app-qbittorrent
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:download-network
init: false
arch:
  - aarch64
  - amd64
backup: cold
map:
  - type: addon_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true
ports:
  8080/tcp: null
  6881/tcp: 6881
  6881/udp: 6881
ports_description:
  8080/tcp: Web interface & API (not required for Ingress)
  6881/tcp: Incoming BitTorrent connections
  6881/udp: Incoming BitTorrent connections, DHT & uTP
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.nju.edu.cn/hassio-addons/qbittorrent
