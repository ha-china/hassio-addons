name: Homepage
version: "2.5.0-0"
slug: homepage
description: "[老王杂谈说]：一个现代、完全静态、快速、安全的完全代理、高度可定制的应用仪表板，支持过 100 种服务的集成及多语言翻译，可通过 YAML 文件或 Docker 标签发现轻松配置。"
url: https://gh-proxy.org/github.com/bytenoodle/hassioaddon/tree/main/homepage
arch:
  - amd64
  - aarch64
map:
  - app_config:rw
docker_api: true
environment:
  HOMEPAGE_ALLOWED_HOSTS: "*"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface port, default is 3000."
panel_icon: "mdi:broadcast"
webui: "http://[HOST]:[PORT:3000]"
