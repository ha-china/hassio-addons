name: Homepage
version: "1.11.0-0"
slug: homepage
description: "[老王杂谈说]：这是一个现代、完全静态、快速、安全且基于代理的高度可定制应用仪表板，支持超过 100 项服务的集成和多语言翻译。可通过 YAML 文件或 Docker 标签发现轻松配置。"
url: https://ghfast.top/github.com/bytenoodle/hassioaddon/tree/main/homepage
arch:
  - amd64
  - aarch64
map:
  - addon_config:rw
docker_api: true
environment:
  HOMEPAGE_ALLOWED_HOSTS: "*"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface port, default is 3000."
panel_icon: "mdi:broadcast"
webui: "http://[HOST]:[PORT:3000]"
