name: Homepage
version: "1.10.1-0"
slug: homepage
description: "[老王杂谈说]：一个现代化的、全静态的、快速、安全、完全代理、高度可定制的应用仪表盘，支持100多个服务的集成和多语言翻译。可通过YAML文件或Docker标签发现轻松配置。"
url: https://ghfast.top/github.com/bytenoodle/hassioaddon/tree/main/homepage
arch:
  - amd64
  - aarch64
map:
  - addon_config:rw
docker_api: true
environment:
  HOMEPAGE_ALLOWED_HOSTS: "*"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface port, default is 3000."
panel_icon: "mdi:broadcast"
webui: "http://[HOST]:[PORT:3000]"
