name: Homepage
version: "2.3.0-0"
slug: homepage
description: "[老王杂谈说]：一个现代化的、完全静态、快速、安全、高度可定制的代理应用仪表板，支持超过 100 个服务的集成及多语言翻译，可通过 YAML 文件或通过 Docker 标签发现轻松配置。"
url: https://gh-proxy.org/github.com/bytenoodle/hassioaddon/tree/main/homepage
arch:
  - amd64
  - aarch64
map:
  - app_config:rw
docker_api: true
environment:
  HOMEPAGE_ALLOWED_HOSTS: "*"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface port, default is 3000."
panel_icon: "mdi:broadcast"
webui: "http://[HOST]:[PORT:3000]"
