name: TOMMY Zero (beta)
version: "8.1.0"
slug: tommysense-homeassistant-addon-beta
description: '[老王杂谈说]：TOMMY Zero 是一个基于 Wi-Fi 数据包信道状态信息（CSI）的无线传感系统，可将现有设备转化为存在传感器；它运行于您的专用硬件上，所有传感数据均保留在本地网络内。'
url: "https://gh-proxy.org/github.com/tommy-sense/homeassistant-addon"
arch:
  - aarch64
  - amd64
image: tommysense/virtual-bridge
startup: application
boot: auto
stage: experimental
host_network: true
apparmor: true
ingress: true
ingress_port: 0
panel_icon: mdi:wifi-arrow-left-right
init: false
map:
  - type: data
    read_only: False
  - type: share
    read_only: False
options:
  ports:
    dashboard: 8089
    file_server_http: 8090
    file_server_https: 8091
    mqtt: 1886
    udp_relay: 8547
  allowed_origins: []
schema:
  ports:
    dashboard: port
    file_server_http: port
    file_server_https: port
    mqtt: port
    udp_relay: port
  allowed_origins:
    - url
