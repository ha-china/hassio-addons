arch:
  - aarch64
  - amd64
description: '[老王杂谈说]：自托管的强大 Web 工具集合，用于日常任务。无广告、无跟踪，直接从浏览器获取快速且易于访问的工具。'
image: ghcr.nju.edu.cn/alexbelgium/omni-tools-{arch}
init: false
map:
  - app_config:rw
name: Omni Tools
options:
  env_vars: []
ports:
  80/tcp: 8188
ports_description:
  80/tcp: Web UI port
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
slug: omni-tools
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons
version: 0.6.1.2
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
