arch:
  - aarch64
  - amd64
description: '[老王杂谈说]：自托管的强大网络工具集合，用于日常任务。无广告，无跟踪，直接从您的浏览器中获取快捷可用的 utilities。'
image: ghcr.nju.edu.cn/alexbelgium/omni-tools-{arch}
init: false
map:
  - app_config:rw
name: Omni Tools
options:
  env_vars: []
ports:
  80/tcp: 8188
ports_description:
  80/tcp: Web UI port
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
slug: omni-tools
url: https://gh-proxy.org/github.com/alexbelgium/hassio-addons
version: "0.7.0"
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
