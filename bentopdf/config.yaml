name: "BentoPDF"
slug: bentopdf
image: ghcr.nju.edu.cn/alexbelgium/bentopdf-{arch}
description: "[老王杂谈说]：隐私优先的 PDF 工具箱。包含 50 多种工具，所有处理均在浏览器端完成。文件不会离开您的设备。"
version: "2.8.11"
url: "https://gh-proxy.org/github.com/alexbelgium/hassio-addons/tree/master/bentopdf"
arch:
  - amd64
  - aarch64
init: false
map:
  - ssl:ro
ports:
  8080/tcp: 8080
  8443/tcp: 8443
ports_description:
  8080/tcp: "BentoPDF HTTP (healthcheck / redirect to HTTPS)"
  8443/tcp: "BentoPDF HTTPS Web UI"
webui: "https://[HOST]:[PORT:8443]"
panel_icon: mdi:file-pdf-box
panel_title: BentoPDF
options:
  log_level: "info"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(info|debug|warn|error)
  ssl: bool
  certfile: str
  keyfile: str
