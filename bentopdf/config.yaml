name: BentoPDF
version: "1.1.0"
slug: bentopdf
image: ghcr.nju.edu.cn/faserf/hassio-addons-bentopdf-{arch}
description: '[老王杂谈说]：自托管、注重隐私的PDF工具包'
url: https://ghfast.top/github.com/FaserF/hassio-addons/tree/master/bentopdf
arch:
  - aarch64
  - amd64
init: false
map:
  - ssl:rw
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
schema:
  ssl: bool
  certfile: str?
  keyfile: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
ports:
  8035/tcp: 8035
ports_description:
  8035/tcp: Web Interface (HTTP/HTTPS)
ingress: true
ingress_port: 8035
panel_icon: mdi:file-pdf-box
