name: "Bluetooth Audio Manager (Dev)"
version: "sha-eb6a5f3"
slug: bluetooth_audio_manager_dev
description: "[老王杂谈说]：null"
url: "https://gh-proxy.org/github.com/scyto/ha-bluetooth-audio-manager"
image: "ghcr.nju.edu.cn/scyto/ha-bluetooth-audio-manager-dev"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: services
boot: auto
# Permissions (least privilege)
host_dbus: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
audio: true
privileged:
  - NET_ADMIN
  - NET_RAW
# Ingress UI
ingress: true
ingress_port: 8099
panel_icon: "mdi:bluetooth-audio"
panel_title: "BT Audio Dev"
# Storage
map:
  - type: data
    read_only: false
  - type: addon_config
    read_only: false
# User options (runtime settings are managed in the app UI)
options:
  log_level: "info"
  mpd_password: ""
schema:
  log_level: "list(debug|info|warning|error)"
  mpd_password: "str?"
apparmor: true
watchdog: "http://[HOST]:[PORT:8099]/api/health"
# Build stage - experimental hides unless enabled in settings
stage: experimental
