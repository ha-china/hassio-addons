name: Hikvision Doorbell
description: '[老王杂谈说]：将你的海康威视门铃连接到 Home Assistant'
version: '3.0.33'
image: ghcr.nju.edu.cn/pergolafabio/hikvision-doorbell
slug: hikvision_doorbell
url: https://gh-proxy.org/github.com/pergolafabio/Hikvision-Addons/tree/main/doorbell
arch:
  - amd64
  - i386
  - aarch64
stage: stable
startup: application
boot: auto
stdin: true
homeassistant_api: true
map:
  - media:rw
full_access: true
# Default options when used as an HA App
options:
  doorbells:
    - name: ""
      ip: ""
      username: admin
      password: ""
      scenes: false
  system:
    log_level: INFO
    sdk_log_level: NONE
  mqtt: {}
# Schema for the options above
schema:
  doorbells:
    - name: str
      ip: str
      port: "int?"
      username: str
      password: str
      output_relays: "int?"
      scenes: "bool?"
      call_state_poll: "int?"
  system:
    log_level: match(^ERROR|WARNING|INFO|DEBUG$)
    sdk_log_level: match(^NONE|ERROR|INFO|DEBUG$)?
  mqtt:
    host: "str?"
    port: "int?"
    ssl: "bool?"
    username: "str?"
    password: "str?"
# To request MQTT configuration using the supervisor API
services:
  - "mqtt:need"
