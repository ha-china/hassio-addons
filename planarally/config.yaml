name: PlanarAlly
version: "v2026.2.0"
upstream: 2024.3
slug: planarally
description: >-
  [老王杂谈说]：PlanarAlly 是一个开源的虚拟桌面（VTT）网页工具，旨在帮助您和玩家探索各种虚构世界；它专为无需联网即可使用而设计（以适应您的黑暗迷宫），并具备灯光和视野等多种功能，以增强沉浸感。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
boot: manual
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:8000]"
ingress: false
ingress_port: 8000
