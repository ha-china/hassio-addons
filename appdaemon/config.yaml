name: AppDaemon
version: 0.18.5
slug: appdaemon
description: '[老王杂谈说]：使用 AppDaemon 4.x 为 Home Assistant 构建的 Python 应用和仪表盘'
url: https://gh-proxy.org/github.com/hassio-addons/app-appdaemon
webui: http://[HOST]:[PORT:5050]
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
uart: true
ports:
  5050/tcp: 5050
ports_description:
  5050/tcp: AppDaemon
map:
  - addon_config:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl
options:
  system_packages: []
  python_packages: []
  init_commands: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  system_packages:
    - str
  python_packages:
    - str
  init_commands:
    - str
image: ghcr.nju.edu.cn/hassio-addons/appdaemon
