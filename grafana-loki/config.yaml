---
name: Grafana Loki
version: 5.0.0
slug: grafana-loki
description: |-
  [老王杂谈说]：Grafana Loki 是一个受 Prometheus 启发的、水平可扩展的、高可用的、多租户的日志聚合系统。
arch:
  - aarch64
  - amd64
image: "ghcr.nju.edu.cn/bluemaex/ha-addons-loki-{arch}"
startup: system
url: https://ghfast.top/github.com/bluemaex/home-assistant-addons/tree/master/loki
init: false
ports:
  3100/tcp: 3100
ports_description:
  3100/tcp: Loki listen port
panel_icon: mdi:router-network
map:
  - config
  - share
options:
  days_to_keep: 30
  log_level: info
schema:
  days_to_keep: int(1,)?
  config_path: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
