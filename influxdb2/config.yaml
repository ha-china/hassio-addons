name: InfluxDB2
version: 1.0.2
slug: influxdb2
description: '[老王杂谈说]：用于指标、事件和实时分析的可扩展数据存储'
url: https://gh-proxy.org/github.com/erik73/hassio-addons
panel_icon: mdi:chart-areaspline
startup: services
homeassistant: 0.92.0b2
hassio_api: true
ingress: true
ingress_port: 1337
ingress_stream: true
arch:
  - aarch64
  - amd64
init: false
map:
  - share:rw
  - ssl
ports:
  8086/tcp: 8086
ports_description:
  8086/tcp: InfluxDB server
options:
  log_level: info
  influxd_log_level: warn
  reporting: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  envvars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  influxd_log_level: list(debug|info|warn|error)?
  reporting: bool
  ssl: bool
  certfile: str
  keyfile: str
  envvars:
    - name: match(^INFLUXD_([A-Z0-9_])+$)
      value: str
image: ghcr.nju.edu.cn/erik73/influxdb2/{arch}
