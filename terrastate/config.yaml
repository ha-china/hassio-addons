  [老王杂谈说]：Terrastate——一个带锁机制的 Terraform/OpenTofu HTTP 状态后端。
arch:
  - aarch64
  - amd64
image: "ghcr.nju.edu.cn/bluemaex/ha-addons-terrastate"
