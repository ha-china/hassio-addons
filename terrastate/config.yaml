  8445/tcp: 8445
ports_description:
  8445/tcp: Terraform HTTP state backend
options:
  log_level: info
  username: terraform
  password: ""
  env_vars: []
schema:
  log_level: list(debug|info|warn|error)
  username: str
  password: password
  env_vars:
    - str
