arch:
  - aarch64
  - amd64
description: "[老王杂谈说]：集中式网络可视性与持续资产发现。"
hassio_api: true
host_network: true
image: ghcr.nju.edu.cn/alexbelgium/netalertx-{arch}
ingress: true
ingress_port: 20211
ingress_stream: true
init: false
map:
  - config:rw
name: NetAlertX
panel_icon: mdi:wifi-check
ports:
  20211/tcp: 20211
  20212/tcp: 20212
ports_description:
  20211/tcp: NetAlertX WebUI port
  20212/tcp: GraphQL & MCP port
privileged:
  - NET_ADMIN
  - NET_RAW
environment:
  PUID: "20211"
  PGID: "20211"
  TZ: Atlantic/Reykjavik
  # Home assistant grants excessive priviliges and does not support application integrity
  SKIP_STARTUP_CHECKS: excessive capabilities.sh,appliance integrity.sh
schema:
  TZ: str?
services:
  - mqtt:want
slug: netalertx
tmpfs: true
udev: true
url: https://ghfast.top/github.com/alexbelgium/hassio-addons
version: "26.3.16-1"
