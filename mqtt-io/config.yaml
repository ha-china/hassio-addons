name: MQTT IO
version: 0.5.0
slug: mqtt-io
description: '[老王杂谈说]：通过 MQTT 公开 GPIO 模块和数字传感器以实现远程控制和监控。'
url: https://gh-proxy.org/github.com/hassio-addons/app-mqtt-io
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
homeassistant_api: true
full_access: true
services:
  - mqtt:want
privileged:
  - SYS_RAWIO
map:
  - addon_config:rw
  - homeassistant_config:rw
  - share:rw
  - ssl
options:
  configuration_file: /config/mqtt-io/config.yml
schema:
  configuration_file: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
image: ghcr.nju.edu.cn/hassio-addons/mqtt-io/{arch}
