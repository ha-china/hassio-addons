name: "SillyTavern"
version: "1.19.0"
upstream: "1.18.0"
slug: sillytavern
description: >-
  [老王杂谈说]：一个允许您与文本生成大语言模型、图像生成引擎以及 TTS 语音模型进行交互的本地安装用户界面。
arch:
  - amd64
  - aarch64
url: "https://gh-proxy.org/github.com/jdeath/homeassistant-addons"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /home/node/app/config
environment:
  TINI_SUBREAPER: "true"
  SILLYTAVERN_VERSION: "latest"
  PUBLIC_PORT: "8000"
  SILLYTAVERN_DATAROOT: "/home/node/app/config/data"
image: ghcr.nju.edu.cn/sillytavern/sillytavern
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:8000]"
panel_admin: false
ingress: false
ingress_port: 8000
