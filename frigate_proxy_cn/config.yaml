name: Frigate Proxy CN
version: 1.6
panel_icon: "mdi:cctv"
panel_title: Frigate
slug: frigate-proxy
description: '[老王杂谈说]：Frigate 代理插件'
url: "https://gh-proxy.org/github.com/blakeblackshear/frigate"
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:5000]/"
watchdog: "http://[HOST]:[PORT:5000]/"
ingress: true
ingress_port: 5000
ingress_entry: /
panel_admin: false
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: Web interface (not required for Home Assistant Ingress)
host_network: false
devices: []
usb: false
tmpfs: false
full_access: false
environment:
  HF_ENDPOINT: "https://huggingface.mirror.frigate-cn.video"
  GITHUB_ENDPOINT: "https://github.mirror.frigate-cn.video"
  TF_KERAS_MOBILENET_V2_WEIGHTS_URL: "https://cnb.cool/frigate-cn/mirrors/storage.googleapis/-/git/raw/main/tensorflow/keras-applications/mobilenet_v2/mobilenet_v2_weights_tf_dim_ordering_tf_kernels_0.35_224_no_top.h5"
  TZ: "Asia/Shanghai"
options:
  server: "http://frigate.local:5000"
  proxy_pass_host: true
  proxy_pass_real_ip: true
schema:
  server: "match(^https?://.+:\\d+$)"
  proxy_pass_host: bool
  proxy_pass_real_ip: bool
services: []
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map: []
