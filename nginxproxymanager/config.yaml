name: Nginx Proxy Manager
version: 4.1.1
slug: nginxproxymanager
description: '[老王杂谈说]：使用简洁、强大的界面托管 Nginx 代理主机'
url: https://gh-proxy.org/github.com/hassio-addons/app-nginx-proxy-manager
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
map:
  - addon_config:rw
backup_exclude:
  - '*/logs'
image: ccr.ccs.tencentyun.com/hassio-addons/nginxproxymanager
