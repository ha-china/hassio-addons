name: "ShieldFile"
version: "2.1.3"
slug: "shieldfile"
description: "[老王杂谈说]：基于Web的安全文件管理器（通过HTTPS的SFTP）"
url: "https://ghfast.top/github.com/FaserF/hassio-addons/tree/master/ShieldFile"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8443
panel_icon: mdi:shield-lock
ports:
  8443/tcp: 8445
ports_description:
  8443/tcp: "Direct Secure Access (HTTPS)"
map:
  - homeassistant_config:rw
  - ssl:rw
  - share:rw
  - media:rw
  - backup:rw
options:
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  users:
    - username: "admin"
      password: "changeme"
  base_directory: "/share"
  port: 8445
  log_level: "info"
schema:
  certfile: str
  keyfile: str
  users:
    - username: str
      password: str
  base_directory: str
  port: port
  log_level: list(debug|info|error|warning)
image: ghcr.nju.edu.cn/faserf/hassio-addons-shieldfile-{arch}
