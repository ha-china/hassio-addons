name: "GlassHome Dashboard (Edge)"
version: "0.9.0-beta.2"
slug: glasshome-edge
description: "[老王杂谈说]：GlassHome 早期测试版，请使用稳定版进行日常使用。"
url: "https://ghfast.top/github.com/glasshome/glasshome-addon"
stage: experimental
arch:
  - amd64
  - aarch64
init: false
ingress: false
panel_icon: mdi:view-dashboard
startup: application
boot: auto
ports:
  3124/tcp: 3124
ports_description:
  3124/tcp: "Web interface (Edge)"
environment:
  PORT: "3124"
map:
  - data:rw
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
image: "ghcr.nju.edu.cn/glasshome/{arch}-glasshome"
