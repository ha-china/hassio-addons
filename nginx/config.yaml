---
name: NGINX
version: 0.4.2
slug: nginx
description: '[老王杂谈说]：包含 PHP 和 MariaDB 的开源 Web 服务器'
url: https://gh-proxy.org/github.com/FaserF/hassio-addons/tree/master/nginx
arch:
  - aarch64
  - amd64
image: ghcr.nju.edu.cn/faserf/hassio-addons-nginx-{arch}
# webui: http://[HOST]:[PORT:80]
map:
  - ssl:rw
  - share:rw
  - config:rw
ingress: true
ingress_port: 80
hassio_api: true
init: false
panel_icon: mdi:web-box
options:
  document_root: /share/htdocs
  php_ini: default
  default_conf: default
  default_ssl_conf: default
  website_name: "web.local"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: "info"
  init_commands: []
schema:
  document_root: str
  php_ini: str
  default_conf: str
  default_ssl_conf: str
  website_name: str
  username: str?
  password: password?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  init_commands:
    - str?
ports:
  80/tcp: 80
  443/tcp: 8324
ports_description:
  80/tcp: Web interface http
  443/tcp: SSL Web interface
stage: experimental
