name: Spoolman
version: "0.27.0-0"
slug: spoolman
description: "[老王杂谈说]：记录您的 3D 打印机耗材卷轴库存。"
arch:
  - amd64
  - aarch64
startup: services
init: false
map:
  - app_config:rw
  - data:rw
ports:
  7912/tcp: 7912
ports_description:
  7912/tcp: "Web interface port (fixed: 7912, do not change). If another add-on uses this host port, HA will show an error."
webui: "http://[HOST]:[PORT:7912]"
environment:
  SPOOLMAN_HOST: "0.0.0.0"
  SPOOLMAN_PORT: "7912"
  SPOOLMAN_DIR_DATA: "/config"
  SPOOLMAN_DIR_BACKUPS: "/config/backups"
  SPOOLMAN_DIR_LOGS: "/config/logs"
  SPOOLMAN_DIR_CACHE: "/config/cache"
options:
  SPOOLMAN_DEBUG_MODE: false
  SPOOLMAN_LEGACY_CLIENT: false
  SPOOLMAN_CORS_ORIGIN: ""
schema:
  SPOOLMAN_DEBUG_MODE: bool
  SPOOLMAN_LEGACY_CLIENT: bool
  SPOOLMAN_CORS_ORIGIN: str?
homeassistant_api: false
hassio_api: false
privileged: []
