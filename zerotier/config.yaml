name: ZeroTier One
version: 0.26.3
slug: zerotier
description: '[老王杂谈说]：用虚拟网络层彻底简化网络，使其在何处工作都保持一致。'
url: https://gh-proxy.org/github.com/hassio-addons/app-zerotier
startup: services
init: false
arch:
  - aarch64
  - amd64
ports:
  9993/tcp: 9993
ports_description:
  9993/tcp: ZeroTier's primary port
host_network: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
devices:
  - /dev/net/tun
map:
  - ssl:rw
options:
  networks: []
  api_auth_token: ''
schema:
  networks:
    - str
  api_auth_token: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
image: ccr.ccs.tencentyun.com/hassio-addons/zerotier
