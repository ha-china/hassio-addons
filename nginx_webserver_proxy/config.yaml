name: "Nginx Proxy Manager + Static Web Server"
slug: nginx_webserver_proxy
description: "[老王杂谈说]：null"
version: "2.14.1.1"
url: "https://gh-proxy.org/github.com/alexbelgium/hassio-addons/tree/master/nginx_webserver_proxy"
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
ports_description:
  80/tcp: "HTTP (static site + NPM proxy hosts)"
  81/tcp: "NPM Admin Web UI"
  443/tcp: "HTTPS (NPM proxy hosts)"
webui: "http://[HOST]:[PORT:81]"
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  static_site_enabled: true
  static_site_root: "/share/www"
  static_site_prefix: "/"
  log_level: "info"
schema:
  static_site_enabled: bool
  static_site_root: str
  static_site_prefix: str
  log_level: list(info|debug|warn|error)
image: "ghcr.nju.edu.cn/alexbelgium/nginx_webserver_proxy-{arch}"
