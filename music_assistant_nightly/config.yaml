name: Music Assistant (NIGHTLY)
version: 2.11.0.dev2026103104
slug: music_assistant_nightly
description: '[老王杂谈说]：Music Assistant 的 nightly 版本。如果您想紧跟 Music Assistant 的最新 bleeding edge 开发，请安装此版本。使用需谨慎，它可能不推荐用于日常或生产环境，因为可能存在不稳定性。'
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.nju.edu.cn/music-assistant/server
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
