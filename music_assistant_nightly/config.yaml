name: Music Assistant (NIGHTLY)
version: 2.9.0.dev2026061009
slug: music_assistant_nightly
description: '[老王杂谈说]：null'
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
