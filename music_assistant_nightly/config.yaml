name: Music Assistant (NIGHTLY)
version: 2.9.0.dev2026040105
slug: music_assistant_nightly
description: '[老王杂谈说]：音乐助手的夜间版。如果你想紧跟音乐助手的最新前沿开发，请安装此版本！请自行承担风险使用，由于可能不稳定，此版本可能不推荐用于日常/生产环境。'
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
panel_icon: mdi:play-circle
panel_title: Music Assistant
panel_admin: false
uart: false
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: experimental
image: ghcr.nju.edu.cn/music-assistant/server
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
