---
name: Wordpress
version: 0.4.0
slug: wordpress
description: "[老王杂谈说]：网络上最受欢迎的发布平台。"
url: "https://gh-proxy.org/github.com/FaserF/hassio-addons/tree/master/wordpress"
arch:
  - aarch64
  - amd64
image: "ghcr.nju.edu.cn/faserf/hassio-addons-wordpress-{arch}"
services:
  - mysql:need
panel_icon: mdi:wordpress
ingress: true
ingress_port: 80
init: false
map:
  - ssl:rw
options:
  wordpress_title: "My Blog"
  wordpress_admin_user: "admin"
  wordpress_admin_email: "admin@example.com"
  wordpress_url: "http://wordpress.local"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: "info"
schema:
  wordpress_title: str
  wordpress_admin_user: str
  wordpress_admin_email: email
  wordpress_url: str?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  reset_database: bool?
  reset_database_confirm: bool?
ports:
  80/tcp: 8099
  443/tcp: 8449
ports_description:
  80/tcp: Web Interface HTTP
  443/tcp: Web Interface HTTPS
stage: experimental
