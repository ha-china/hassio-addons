name: "GlassHome Dashboard"
version: "1.0.0"
slug: glasshome
description: "[老王杂谈说]：用于 Home Assistant 的现代、可自定义仪表板，支持拖拽组件"
url: "https://gh-proxy.org/github.com/glasshome/homeassistant-addon"
arch:
  - amd64
  - aarch64
init: false
ingress: false
panel_icon: mdi:view-dashboard
webui: "http://[HOST]:[PORT:3123]/"
startup: application
boot: auto
ports:
  3123/tcp: 3123
ports_description:
  3123/tcp: "Web interface"
map:
  - data:rw
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
image: "ghcr.nju.edu.cn/glasshome/dash"
